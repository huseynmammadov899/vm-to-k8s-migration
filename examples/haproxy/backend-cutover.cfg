# Cutover = change one server line. Rollback = swap the comments back.
# Validate before reload:  haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy

frontend fe_http
    bind *:80
    acl host_orders hdr(host) -i orders.corp.example
    use_backend be_orders if host_orders

backend be_orders
    mode http
    option httpchk GET /actuator/health
    http-check expect status 200
    # Do NOT rewrite Host: the Ingress rule matches the client-facing name.
    # http-request set-header Host orders-internal.example   <-- don't

    # --- before: legacy VM ---
    # server vm1 10.0.10.21:9180 check

    # --- after: Kubernetes ingress controller ---
    server k8s-ingress 10.0.50.250:80 check
