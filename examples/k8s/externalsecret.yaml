# Requires External Secrets Operator and a ClusterSecretStore named "vault-backend".
# Vault path apps/orders-api holds keys like DB_PASSWORD, REDIS_HOST, REDIS_PASSWORD;
# each key becomes an env var with the same name (see docs/01).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: orders-api-secrets
  namespace: apps
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: orders-api-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: apps/orders-api
